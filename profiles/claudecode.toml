# sodabox vendor profile — MANAGED BY SODABOX. Do not edit: sodabox overwrites
# this file whenever it differs from the copy shipped with the binary. To
# customise, copy it to a new name in this dir and apply that profile instead.
#
# Applying a profile copies its rules into the VM's policy.toml, so later
# changes here don't affect VMs it was already applied to.
description = "Claude Code: Anthropic API and account login"

# Claude API requests.
[[rules]]
kind = "domain"
name = "api.anthropic.com"
scope = "exact"
ports = "443"
proto = "tcp"

# Login with a Claude account.
[[rules]]
kind = "domain"
name = "claude.ai"
scope = "exact"
ports = "443"
proto = "tcp"

# Login with an Anthropic Console account.
[[rules]]
kind = "domain"
name = "platform.claude.com"
scope = "exact"
ports = "443"
proto = "tcp"

# Deliberately not included: statsig.anthropic.com (telemetry), sentry.io
# (error reporting), downloads.claude.ai / storage.googleapis.com (the
# auto-updater; the guest's Nix config pins the version instead). Add them in
# a profile of your own if you want them.
