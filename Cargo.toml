# sodabox — rootless microVM sandbox with deny-by-default egress.
# Workspace layout mirrors the ADRs: a `sodabox` CLI binary over library crates
# for the supervisor (ADR-0007), egress filter proxy (ADR-0004), DNS filter
# (ADR-0005), and shared types (policy/events/protocol, ADR-0006/0009).
[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/proxy",
    "crates/dns",
    "crates/supervisor",
    "crates/cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "process", "signal", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Format-preserving edits of policy.toml (comments survive, ADR-0015).
toml_edit = "0.22"
clap = { version = "4", features = ["derive"] }
# Dynamic shell completion (`COMPLETE=<shell> soda`); the API is still behind
# clap_complete's `unstable-dynamic` feature.
clap_complete = { version = "4", features = ["unstable-dynamic"] }
anyhow = "1"
thiserror = "2"
# TUI. ratatui re-exports crossterm under `ratatui::crossterm`,
# so a single dep covers rendering, raw mode and input — no separate crossterm
# entry to keep version-aligned.
ratatui = "0.29"
# internal crates
sodabox-common = { path = "crates/common" }
sodabox-proxy = { path = "crates/proxy" }
sodabox-dns = { path = "crates/dns" }
sodabox-supervisor = { path = "crates/supervisor" }
