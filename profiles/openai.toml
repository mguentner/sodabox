# sodabox vendor profile — MANAGED BY SODABOX. Do not edit: sodabox overwrites
# this file whenever it differs from the copy shipped with the binary. To
# customise, copy it to a new name in this dir and apply that profile instead.
#
# Applying a profile copies its rules into the VM's policy.toml, so later
# changes here don't affect VMs it was already applied to.
description = "OpenAI: API and ChatGPT sign-in (e.g. Codex CLI)"

# OpenAI API requests.
[[rules]]
kind = "domain"
name = "api.openai.com"
scope = "exact"
ports = "443"
proto = "tcp"

# Sign in with ChatGPT (OAuth).
[[rules]]
kind = "domain"
name = "auth.openai.com"
scope = "exact"
ports = "443"
proto = "tcp"

# Codex with a ChatGPT plan talks to the ChatGPT backend.
[[rules]]
kind = "domain"
name = "chatgpt.com"
scope = "exact"
ports = "443"
proto = "tcp"
